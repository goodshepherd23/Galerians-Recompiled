format_version = 5
id = "galerians.cheats"
version = "1.0.0"
name = "Galerians Cheats"
author = "goodshepherd23 (codes from the DuckStation cheat database and Almar's Guides)"
description = "GameShark, CodeBreaker and Action Replay cheats for Galerians (USA), all three discs. Memory cheats are rewritten every frame; code patches change an instruction in the game while they are on. All are off by default."
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "SLUS-00986"

[[target]]
game_id = "SLUS-01098"

[[target]]
game_id = "SLUS-01099"

